plugins {
    id 'com.android.application' version '9.2.1' apply false
}

allprojects {
    dependencyLocking { lockAllConfigurations() }
}

// Keep generated artifacts outside the formal source tree.
def stage9BuildRoot = file(findProperty('instrumentBuildRoot') ?: 'D:/FPGA/formal_project/formal_one/android_build')
allprojects {
    layout.buildDirectory.set(new File(stage9BuildRoot, project == rootProject ? '_root' : project.name))
}
