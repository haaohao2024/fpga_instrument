plugins {
    id 'com.android.application' version '9.2.1' apply false
}

allprojects {
    dependencyLocking { lockAllConfigurations() }
}

// Optional: -PinstrumentBuildRoot=<dir> keeps generated artifacts outside the source tree;
// without it Gradle uses the usual build/ directories inside this project.
def instrumentBuildRoot = findProperty('instrumentBuildRoot')
if (instrumentBuildRoot) {
    allprojects {
        layout.buildDirectory.set(new File(file(instrumentBuildRoot), project == rootProject ? '_root' : project.name))
    }
}
